# Configuration HTTPS avec Let's Encrypt
# Ce fichier est un template - le script init-letsencrypt.sh le copie vers nginx.conf

# HTTP - Redirection vers HTTPS + Challenge ACME
server {
    listen 80;
    server_name alexandre-leclercq-pro.fr;

    # Challenge Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirection vers HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - Configuration SSL
server {
    listen 443 ssl;
    server_name alexandre-leclercq-pro.fr;

    # Certificats SSL Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/alexandre-leclercq-pro.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alexandre-leclercq-pro.fr/privkey.pem;

    # Parametres SSL recommandes
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Proxy vers FastAPI
    location / {
        proxy_pass http://cv-app:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300;
        proxy_connect_timeout 300;
    }

    # Fichiers statiques
    location /static/ {
        alias /app/static/;
    }
}
