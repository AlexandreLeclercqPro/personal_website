services:
  cv-app:
    build: .
    container_name: mon-cv-dev
    ports:
      - "${HOST_PORT:-8000}:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx_dev
    ports:
      - "80:80"
    volumes:
      - ./config/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/app/static:ro
    depends_on:
      - cv-app
    restart: unless-stopped
